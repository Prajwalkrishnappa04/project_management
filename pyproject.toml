
[project]
name = "project_management"
authors = [
    { name = "Prajwal k", email = "prajwalkrishnappa04@gmail.com" }
]
description = "Building project management app for landlords"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe version compatibility for Bench
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# Dependencies used only in developer mode
[tool.bench.dev-dependencies]

# Ubuntu packages required during deployment
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "UP", "B", "RUF",
]
ignore = [
    "B017", "B018", "B023", "B904",
    "E101", "E402", "E501", "E741",
    "F401", "F403", "F405", "F722",
    "W191", "UP030", "UP031", "UP032",
    "UP037", "UP040",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
